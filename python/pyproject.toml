[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h5PYRe"
version = "0.1.0"
description = "Cross-language HDF5 cohort & parameter interchange (Python side)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Hintz", email = "dhintz@guardanthealth.com" }]
dependencies = [
    "h5py>=3",
    "numpy>=1.20",
    "pandas>=1.3",
    "Pillow>=8",
    "pyarrow>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["h5PYRe"]
